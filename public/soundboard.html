<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Soundboard</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 100%; min-height: 100%; background: #10101a; color: #fff; font-family: 'Segoe UI', Arial, sans-serif; }
      body { display: flex; flex-direction: column; align-items: center; padding: 16px 14px 86px; }
      .top { width: 100%; max-width: 480px; display: flex; flex-direction: column; align-items: center; position: sticky; top: 0; z-index: 5; padding: 8px 0 12px; background: #10101a; }
      h1 { font-size: 24px; margin-bottom: 4px; text-align: center; }
      .hint { font-size: 13px; color: #9a9ab0; text-align: center; line-height: 1.45; max-width: 420px; }
      #grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; width: 100%; max-width: 480px; min-height: 160px; }
      .card { background: #202036; border: 1px solid #2e2e4a; border-radius: 14px; padding: 10px; display: flex; flex-direction: column; gap: 8px; }
      .card button {
        background: #2b2b44; border: 1px solid #3a3a56; color: #fff;
        border-radius: 10px; padding: 12px 8px; font-size: 14px; font-weight: 700; min-height: 56px;
        overflow: hidden; text-overflow: ellipsis; white-space: nowrap; width: 100%; cursor: pointer;
      }
      .card button:active { transform: scale(0.98); background: #fe2c55; }
      .card select { background: #10101a; color: #fff; border: 1px solid #3a3a56; border-radius: 10px; padding: 10px; font-size: 13px; width: 100%; min-height: 40px; }
      .card select:focus, .card button:focus-visible { outline: 2px solid #ffd166; outline-offset: 2px; }
      #status {
        position: fixed; left: 50%; transform: translateX(-50%); bottom: 10px;
        width: calc(100% - 24px); max-width: 456px; min-height: 48px;
        display: flex; align-items: center; justify-content: center; text-align: center;
        background: #202036; border: 1px solid #2e2e4a; border-radius: 12px;
        font-size: 13px; color: #aaa; padding: 10px 12px; z-index: 10;
      }
      @media (min-width: 700px) { #grid { grid-template-columns: repeat(3, 1fr); max-width: 720px; } }
    </style>
  </head>
  <body>
    <div class="top">
      <h1>🎧 Soundboard</h1>
      <div class="hint">Tap nama file buat bunyi. Ganti dropdown key buat ubah keybind (F1-F12), langsung tersimpan.</div>
    </div>
    <div id="grid"></div>
    <div id="status">Memuat suara...</div>
    <script>
      const grid = document.getElementById('grid');
      const status = document.getElementById('status');
      const KEYS = ['F1','F2','F3','F4','F5','F6','F7','F8','F9','F10','F11','F12'];
      function playKey(key) {
        return fetch('/sound/' + encodeURIComponent(key), { method: 'GET' })
          .then((r) => { if (!r.ok) throw new Error('not found'); return r.json(); })
          .then(() => { status.textContent = '🔊 Playing: ' + key; })
          .catch(() => { status.textContent = '❌ Sound tidak ditemukan: ' + key; });
      }
      async function bindKey(file, key) {
        const r = await fetch('/bind', { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify({ file, key }) });
        const j = await r.json();
        status.textContent = j.ok ? `✅ Key ${file} jadi ${key}` : `❌ Gagal: ${j.error || ''}`;
        if (j.ok) loadSounds();
      }
      async function loadSounds() {
        const r = await fetch('/sounds');
        const files = await r.json();
        status.textContent = files.length + ' sounds ready';
        grid.innerHTML = '';
        files.forEach((f) => {
          const card = document.createElement('div');
          card.className = 'card';
          const btn = document.createElement('button');
          btn.textContent = (f.bindKey ? f.bindKey + ' • ' : '') + f.name;
          btn.addEventListener('click', () => playKey(f.bindKey || f.key));
          const sel = document.createElement('select');
          sel.innerHTML = `<option value="">Ganti key...</option>` + KEYS.map((k) => `<option value="${k}" ${k === f.bindKey ? 'selected' : ''}>${k}</option>`).join('');
          sel.addEventListener('change', () => { if (sel.value) bindKey(f.name, sel.value); });
          card.appendChild(btn);
          card.appendChild(sel);
          grid.appendChild(card);
        });
      }
      loadSounds().catch(() => { status.textContent = '❌ Gagal memuat soundboard'; });
    </script>
  </body>
</html>
