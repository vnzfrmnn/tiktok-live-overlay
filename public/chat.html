<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Chat Live</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=Space+Grotesk:wght@500;600&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --bg: #0f172a;
        --surface: #1b2540;
        --surface-2: #16203a;
        --line: #2a3a5c;
        --text: #e6edf7;
        --muted: #8fa3bf;
        --accent: #7dd3fc;
        --accent-strong: #38bdf8;
        --ink: #0b1220;
        --font-display: 'Space Grotesk', system-ui, sans-serif;
        --font-body: 'IBM Plex Sans', system-ui, sans-serif;
      }

      * { margin: 0; padding: 0; box-sizing: border-box; }

      html { height: 100%; }
      body {
        min-height: 100vh;
        height: 100dvh;
        background: var(--bg);
        color: var(--text);
        font-family: var(--font-body);
        font-size: 15px;
        line-height: 1.5;
        display: flex;
        flex-direction: column;
        overflow: hidden;
      }

      /* Bar atas */
      .top {
        flex: 0 0 auto;
        background: var(--bg);
        border-bottom: 1px solid var(--line);
        padding: 14px 14px 10px;
        padding-top: max(14px, env(safe-area-inset-top));
      }
      .top-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
      }
      h1 {
        font-family: var(--font-display);
        font-size: 18px;
        font-weight: 600;
        letter-spacing: -0.01em;
      }
      .nav {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 44px;
        padding: 0 14px;
        border: 1px solid var(--line);
        border-radius: 8px;
        color: var(--accent);
        text-decoration: none;
        font-size: 14px;
        font-weight: 600;
        background: var(--surface-2);
        transition: background 0.12s ease, border-color 0.12s ease;
      }
      .nav:hover, .nav:active { background: var(--surface); border-color: var(--accent); }
      .nav:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

      .chips { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
      .chip {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        background: var(--surface-2);
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 6px 10px;
        font-size: 13px;
        color: var(--muted);
        font-variant-numeric: tabular-nums;
      }
      .chip b {
        color: var(--text);
        font-weight: 600;
        font-family: var(--font-display);
        font-size: 14px;
      }
      .conn {
        margin-top: 8px;
        font-size: 12.5px;
        color: var(--muted);
      }
      .conn[hidden] { display: none; }

      /* Feed */
      .feed {
        flex: 1 1 auto;
        overflow-y: auto;
        -webkit-overflow-scrolling: touch;
        padding: 12px 14px calc(16px + env(safe-area-inset-bottom));
        display: flex;
        flex-direction: column;
        gap: 12px;
      }

      .msg {
        display: flex;
        align-items: flex-start;
        gap: 10px;
        animation: rise 0.18s ease;
      }
      @keyframes rise {
        from { opacity: 0; transform: translateY(4px); }
        to { opacity: 1; transform: translateY(0); }
      }
      .avatar {
        width: 34px;
        height: 34px;
        flex: 0 0 34px;
        border-radius: 50%;
        background: var(--surface);
        border: 2px solid var(--accent);
        color: var(--accent);
        font-weight: 600;
        font-size: 15px;
        display: flex;
        align-items: center;
        justify-content: center;
        text-transform: uppercase;
      }
      .bubble { min-width: 0; flex: 1; }
      .who {
        display: block;
        font-size: 13px;
        font-weight: 600;
        color: var(--accent);
        word-break: break-all;
      }
      .txt {
        display: block;
        font-size: 15px;
        color: var(--text);
        word-break: break-word;
      }

      .evt {
        font-size: 13.5px;
        color: var(--muted);
        line-height: 1.45;
        padding-left: 2px;
        word-break: break-word;
        animation: rise 0.18s ease;
      }

      .empty {
        font-size: 13.5px;
        color: var(--muted);
        text-align: center;
        padding: 24px 8px;
      }
    </style>
  </head>
  <body>
    <header class="top">
      <div class="top-row">
        <h1>💬 Chat Live</h1>
        <a class="nav" href="/">Soundboard</a>
      </div>
      <div class="chips">
        <span class="chip">👁 <b id="viewers">0</b> penonton</span>
        <span class="chip">❤ <b id="likes">0</b> likes</span>
      </div>
      <div id="conn" class="conn" hidden>memutus… menyambung ulang</div>
    </header>

    <main id="feed" class="feed" aria-live="polite">
      <p class="empty">Belum ada event. Chat, gift, like, dan follow akan muncul di sini.</p>
    </main>

    <script>
      (function () {
        var feed = document.getElementById('feed');
        var viewersEl = document.getElementById('viewers');
        var likesEl = document.getElementById('likes');
        var conn = document.getElementById('conn');
        var MAX = 120;

        function fmt(n) {
          var v = Number(n);
          return isFinite(v) ? v.toLocaleString('id-ID') : '0';
        }

        function atBottom() {
          return feed.scrollHeight - feed.scrollTop - feed.clientHeight < 48;
        }

        function append(node) {
          var empty = feed.querySelector('.empty');
          if (empty) empty.remove();
          var stick = atBottom();
          feed.appendChild(node);
          while (feed.children.length > MAX) feed.removeChild(feed.firstChild);
          if (stick) feed.scrollTop = feed.scrollHeight;
        }

        function addChat(username, text) {
          var row = document.createElement('div');
          row.className = 'msg';
          var av = document.createElement('div');
          av.className = 'avatar';
          var initial = String(username || '?').trim().charAt(0) || '?';
          av.textContent = initial;
          var wrap = document.createElement('div');
          wrap.className = 'bubble';
          var who = document.createElement('span');
          who.className = 'who';
          who.textContent = '@' + (username || 'anon');
          var txt = document.createElement('span');
          txt.className = 'txt';
          txt.textContent = text || '';
          wrap.appendChild(who);
          wrap.appendChild(txt);
          row.appendChild(av);
          row.appendChild(wrap);
          append(row);
        }

        function addEvent(text) {
          var d = document.createElement('div');
          d.className = 'evt';
          d.textContent = text;
          append(d);
        }

        function handle(p) {
          if (!p || !p.type) return;
          if (p.type === 'chat') {
            addChat(p.username, p.text);
          } else if (p.type === 'gift') {
            var n = Number(p.count) || 1;
            var coins = p.coins != null ? ' (' + p.coins + ' coin)' : '';
            addEvent('🎁 ' + (p.user || 'Seseorang') + ' · ' + (p.gift || 'gift') + ' ×' + n + coins);
          } else if (p.type === 'member') {
            addEvent('→ ' + (p.user || 'Seseorang') + ' bergabung');
          } else if (p.type === 'follow') {
            addEvent('❤ ' + (p.user || 'Seseorang') + ' mulai follow');
          } else if (p.type === 'like') {
            if (!p.count) return;
            addEvent('❤ ' + (p.user || 'Seseorang') + ' ×' + p.count);
            if (p.total != null) likesEl.textContent = fmt(p.total);
          } else if (p.type === 'stats') {
            viewersEl.textContent = fmt(p.viewers);
            likesEl.textContent = fmt(p.likesTotal);
          }
        }

        // Snapshot awal
        fetch('/stats')
          .then(function (r) { return r.json(); })
          .then(function (s) {
            if (!s) return;
            viewersEl.textContent = fmt(s.viewers);
            likesEl.textContent = fmt(s.likesTotal);
          })
          .catch(function () {});

        // Stream event
        var es = new EventSource('/events');
        es.onmessage = function (ev) {
          var p = null;
          try { p = JSON.parse(ev.data); } catch (e) { return; }
          handle(p);
        };
        es.onopen = function () { conn.hidden = true; };
        es.onerror = function () { conn.hidden = false; };
      })();
    </script>
  </body>
</html>
